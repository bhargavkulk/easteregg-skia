[project]
name = "easteregg-skia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhargav Kulkarni", email = "bhargav.kulkarni1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.57.0",
    "skia-python>=138.0",
]

[dependency-groups]
dev = [
    "pyrefly>=0.46.1",
    "ruff>=0.14.10",
]

[tool.ruff]
lint.ignore = ["E741"]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.pyrefly]
project-includes = ['scripts/']
ignore-missing-imports = ["skia"]
